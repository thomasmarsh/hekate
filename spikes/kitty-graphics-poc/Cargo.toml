[package]
name = "kitty-graphics-poc"
version = "0.0.0"
edition = "2024"
publish = false

# Detached from the Hekate workspace on purpose. This is a disposable spike:
# it must not join the pinned workspace, the CI gates, or the dependency
# direction check, and it is deliberately independent of the shared
# presentation layer so it can fail cheaply. See node TAS-010.
[workspace]

[dependencies]
base64 = "0.22"
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
