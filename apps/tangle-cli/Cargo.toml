[package]
name = "tangle-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Headless command-line interface for Tangle."

[dependencies]
tangle-model.workspace = true
tangle-sim.workspace = true
clap.workspace = true
# Compression for the run directory's gzip event stream. Declared here rather
# than at the workspace level because it belongs to the output layer alone:
# `tangle-model` and `tangle-sim` must never depend on it.
flate2 = "1.1.10"
# Parquet for the run directory's sampled trajectories, Apache `arrow-rs`. These
# are declared here for the same reason as `flate2`: trajectory output belongs
# to the CLI/output layer, and neither `tangle-model` nor `tangle-sim` may
# depend on them. Default features are off so the writer carries only the two
# things the trajectory columns need, Arrow record batches and Snappy pages.
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "snap"] }
arrow-array = { version = "59.3.0", default-features = false }
arrow-schema = { version = "59.3.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
